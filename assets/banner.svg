<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner: Ismail Mohidin - Lecturer & Full-Stack Developer">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b3156"/>
      <stop offset="100%" stop-color="#07293f"/>
    </linearGradient>
    <filter id="f" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#g)" />
  <!-- subtle circles -->
  <g fill="rgba(255,255,255,0.03)">
    <circle cx="100" cy="60" r="80" />
    <circle cx="1100" cy="240" r="120" />
    <circle cx="900" cy="40" r="60" />
  </g>
  <text x="50%" y="42%" fill="#ffffff" font-family="Inter, Roboto, Arial, sans-serif" font-size="40" font-weight="700" text-anchor="middle">Ismail Mohidin</text>
  <text x="50%" y="62%" fill="#ffffff" font-family="Inter, Roboto, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Lecturer &amp; Full‑Stack Developer</text>
</svg>
